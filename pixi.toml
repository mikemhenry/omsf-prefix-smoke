[workspace]
name = "omsf-prefix-smoke"
version = "0.1.0"
description = "End-to-end smoke test for OMSF conda publishing through prefix.dev"
authors = ["Open Molecular Software Foundation"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.15"
packaging = ">=24"
pip = "*"
setuptools = ">=77"
pytest = ">=8"
pytest-cov = ">=5"
ruff = ">=0.11"
mypy = ">=1.15"
rattler-build = ">=0.72.2,<0.73"

[pypi-dependencies]
omsf-prefix-smoke = { path = ".", editable = true }

[tasks]
test = "pytest -q"
coverage = "pytest --cov=omsf_prefix_smoke --cov-report=term-missing"
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy"
verify = "omsf-prefix-smoke verify --pretty"
release-check = "python scripts/check_release_tag.py v0.1.0"
build-conda = "rattler-build build --recipe conda.recipe/recipe.yaml"
check = { depends-on = ["lint", "format-check", "typecheck", "coverage", "verify"] }
